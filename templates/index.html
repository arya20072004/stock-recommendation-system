<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty Analyst — ML Stock Dashboard</title>
    <meta name="description" content="ML-powered stock analysis dashboard for Nifty 50 stocks with real-time recommendations.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* ── Reset & Base ─────────────────────────────── */
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #080c14; --bg2: #0b1120; --bg3: #0f1729;
            --surface: rgba(13,23,42,0.65); --border: rgba(0,212,255,0.12);
            --cyan: #00d4ff; --green: #00ff88; --red: #ff3366;
            --amber: #f59e0b; --muted: #8892a4; --text: #c8d0dc;
            --white: #eaf0f6; --glow-cyan: 0 0 20px rgba(0,212,255,0.15);
            --font-ui: 'Outfit', sans-serif; --font-mono: 'Space Mono', monospace;
        }
        html { font-size: 14px; }
        body {
            font-family: var(--font-ui); background: var(--bg); color: var(--text);
            min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(rgba(0,212,255,0.04) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.2); border-radius: 3px; }

        /* ── Navbar ────────────────────────────────────── */
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; height: 56px;
            background: rgba(8,12,20,0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; }
        .nav-logo svg { width: 22px; height: 22px; }
        .nav-logo span {
            font-family: var(--font-mono); font-size: 0.92rem; font-weight: 700;
            letter-spacing: 3px; color: var(--white);
        }
        .nav-center { display: flex; align-items: center; }
        .selector-wrap {
            display: flex; align-items: center; gap: 0;
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 6px; padding: 0 12px; height: 36px;
        }
        .selector-wrap .prefix {
            font-family: var(--font-mono); color: var(--cyan);
            font-size: 0.9rem; margin-right: 6px; user-select: none;
        }
        #stockSelector {
            font-family: var(--font-mono); font-size: 0.85rem;
            background: transparent; border: none; color: var(--white);
            outline: none; cursor: pointer; appearance: none;
            -webkit-appearance: none; padding-right: 18px;
            min-width: 160px;
        }
        #stockSelector option { background: var(--bg2); color: var(--white); }
        .selector-wrap .caret {
            margin-left: -14px; color: var(--muted); pointer-events: none;
            font-size: 0.6rem;
        }
        .nav-right {
            display: flex; align-items: center; gap: 18px;
            font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted);
        }
        .market-badge {
            padding: 3px 10px; border-radius: 4px; font-size: 0.7rem;
            font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
        }
        .market-open { background: rgba(0,255,136,0.12); color: var(--green); border: 1px solid rgba(0,255,136,0.25); }
        .market-closed { background: rgba(255,51,102,0.1); color: var(--red); border: 1px solid rgba(255,51,102,0.2); }

        /* ── Main Layout ──────────────────────────────── */
        .dashboard {
            display: grid; grid-template-columns: 1fr 340px;
            gap: 20px; padding: 20px 28px 28px;
            max-width: 1440px; margin: 0 auto;
        }

        /* ── Chart Area ───────────────────────────────── */
        .chart-section { display: flex; flex-direction: column; gap: 0; }
        .chart-header {
            display: flex; align-items: baseline; gap: 12px;
            margin-bottom: 10px;
        }
        .chart-header h2 {
            font-family: var(--font-mono); font-size: 1.1rem;
            color: var(--white); font-weight: 700;
        }
        .chart-header span {
            font-size: 0.78rem; color: var(--muted); letter-spacing: 0.5px;
        }
        .chart-wrap {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; overflow: hidden; backdrop-filter: blur(8px);
        }
        #priceChart { width: 100%; height: 420px; }
        .chart-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: 0.2; }
        #volumeChart { width: 100%; height: 120px; }

        /* ── Cards ─────────────────────────────────────── */
        .right-col { display: flex; flex-direction: column; gap: 16px; }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; padding: 20px; backdrop-filter: blur(10px);
            transition: box-shadow 0.3s ease, opacity 0.4s ease;
            position: relative; overflow: hidden;
        }
        .card:hover { box-shadow: 0 0 24px rgba(0,212,255,0.08); }
        .card-accent { border-top: 2px solid var(--cyan); }
        .card-label {
            font-size: 0.68rem; letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--muted); margin-bottom: 14px; font-weight: 500;
        }

        /* Price Stats */
        .price-big {
            font-family: var(--font-mono); font-size: 1.95rem;
            font-weight: 700; color: var(--white); line-height: 1;
        }
        .price-change {
            display: inline-flex; align-items: center; gap: 4px;
            font-family: var(--font-mono); font-size: 0.85rem;
            margin-top: 6px;
        }
        .price-change.up { color: var(--green); }
        .price-change.down { color: var(--red); }
        .stats-row {
            display: flex; gap: 20px; margin-top: 16px;
            padding-top: 14px; border-top: 1px solid rgba(0,212,255,0.08);
        }
        .stat-item { flex: 1; }
        .stat-item .label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
        .stat-item .value {
            font-family: var(--font-mono); font-size: 0.92rem; color: var(--white);
        }

        /* ML Signal */
        .signal-text {
            font-family: var(--font-mono); font-size: 2rem;
            font-weight: 700; letter-spacing: 3px; text-align: center;
            padding: 12px 0 8px;
        }
        .signal-BUY { color: var(--green); text-shadow: 0 0 30px rgba(0,255,136,0.35); }
        .signal-SELL { color: var(--red); text-shadow: 0 0 30px rgba(255,51,102,0.35); }
        .signal-HOLD { color: var(--amber); text-shadow: 0 0 30px rgba(245,158,11,0.3); }
        .signal-UNCERTAIN { color: var(--muted); text-shadow: none; }
        .confidence-bar-wrap {
            margin-top: 10px; display: flex; align-items: center; gap: 10px;
        }
        .confidence-track {
            flex: 1; height: 5px; background: rgba(255,255,255,0.06);
            border-radius: 3px; overflow: hidden;
        }
        .confidence-fill {
            height: 100%; border-radius: 3px;
            background: var(--cyan); transition: width 0.8s cubic-bezier(0.22,1,0.36,1);
        }
        .confidence-label {
            font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted);
            white-space: nowrap;
        }
        .signal-time {
            text-align: center; font-size: 0.7rem; color: rgba(136,146,164,0.6);
            margin-top: 10px;
        }

        /* Feature Bars */
        .feature-row {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 0; transition: background 0.2s;
            border-radius: 4px; margin: 0 -6px; padding-left: 6px; padding-right: 6px;
        }
        .feature-row:hover { background: rgba(0,212,255,0.04); }
        .feature-name {
            width: 110px; font-size: 0.78rem; color: var(--text);
            text-transform: capitalize; flex-shrink: 0;
        }
        .feature-bar-track {
            flex: 1; height: 6px; background: rgba(255,255,255,0.05);
            border-radius: 3px; overflow: hidden;
        }
        .feature-bar-fill {
            height: 100%; background: var(--cyan); border-radius: 3px;
            transition: width 0.7s cubic-bezier(0.22,1,0.36,1);
            width: 0;
        }
        .feature-pct {
            font-family: var(--font-mono); font-size: 0.75rem;
            color: var(--muted); width: 44px; text-align: right; flex-shrink: 0;
        }

        /* Disclaimer */
        .disclaimer {
            font-size: 0.68rem; color: rgba(136,146,164,0.4);
            text-align: center; padding: 4px 0;
        }

        /* ── Skeleton Loading ─────────────────────────── */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        .skeleton-line { height: 14px; margin-bottom: 10px; border-radius: 4px; }
        .skeleton-block { height: 40px; margin-bottom: 12px; border-radius: 6px; }

        /* ── Chart Legend ─────────────────────────────── */
        .legend-item { display: flex; gap: 4px; align-items: baseline; }
        .legend-label { color: rgba(136,146,164,0.7); }
        .legend-val { color: var(--text); font-weight: 500; }
        .legend-val.up { color: var(--green); }
        .legend-val.down { color: var(--red); }

        /* ── Fade-in ──────────────────────────────────── */
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

        /* ── Error ─────────────────────────────────────── */
        .error-box {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%; text-align: center; padding: 20px;
        }
        .error-box .icon { font-size: 2rem; margin-bottom: 10px; }
        .error-box .msg { color: var(--red); font-weight: 600; margin-bottom: 6px; }
        .error-box .detail { font-size: 0.8rem; color: var(--muted); }

        /* ── Nav Links ─────────────────────────────────── */
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-link {
            font-family: var(--font-mono); font-size: 0.78rem;
            color: var(--muted); text-decoration: none;
            padding: 4px 0; letter-spacing: 1px;
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--white); }
        .nav-link.active { color: var(--cyan); border-bottom: 2px solid var(--cyan); }

        /* ── Responsive ───────────────────────────────── */
        @media (max-width: 960px) {
            .dashboard { grid-template-columns: 1fr; }
            .navbar { padding: 0 16px; flex-wrap: wrap; height: auto; gap: 8px; padding: 10px 16px; }
            .nav-right { font-size: 0.68rem; gap: 10px; }
            .nav-links { gap: 10px; }
        }
    </style>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────── -->
<nav class="navbar" id="navbar">
    <div class="nav-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 8L12 14L20 8L12 2Z" fill="var(--cyan)" opacity="0.8"/>
            <path d="M4 12L12 18L20 12" stroke="var(--cyan)" stroke-width="1.5" fill="none" opacity="0.5"/>
            <path d="M4 16L12 22L20 16" stroke="var(--cyan)" stroke-width="1.5" fill="none" opacity="0.25"/>
        </svg>
        <span>NIFTY ANALYST</span>
    </div>

    <div class="nav-center">
        <div class="selector-wrap">
            <span class="prefix">&gt;</span>
            <select id="stockSelector"></select>
            <span class="caret">▼</span>
        </div>
    </div>

    <div class="nav-links">
        <a href="/" class="nav-link active">&gt; DASHBOARD</a>
        <a href="/portfolio" class="nav-link">&gt; PORTFOLIO</a>
    </div>

    <div class="nav-right">
        <span id="liveClock">--:--:--</span>
        <span id="marketBadge" class="market-badge market-closed">CLOSED</span>
        <span id="lastRefresh" style="opacity:0.5">—</span>
    </div>
</nav>

<!-- ── Dashboard ──────────────────────────────────────── -->
<div class="dashboard">

    <!-- LEFT: Charts -->
    <div class="chart-section">
        <div class="chart-header">
            <h2 id="chartTicker">—</h2>
            <span>5 Year Price History</span>
        </div>
        <div class="chart-wrap" style="position: relative;">
            <div id="ohlcvLegend" style="position: absolute; top: 12px; left: 16px; z-index: 10; font-family: var(--font-mono); font-size: 0.75rem; pointer-events: none; display: flex; gap: 14px; flex-wrap: wrap;">
                <!-- Legend injected by JS -->
            </div>
            <div id="priceChart"></div>
            <div class="chart-divider"></div>
            <div id="volumeChart"></div>
        </div>
    </div>

    <!-- RIGHT: Info Panel -->
    <div class="right-col" id="rightPanel">
        <!-- Content injected by JS -->
    </div>
</div>

<script>
(function(){
    /* ── Globals ───────────────────────────────────────── */
    const API = '';
    const sel = document.getElementById('stockSelector');
    const rightPanel = document.getElementById('rightPanel');
    const legendEl = document.getElementById('ohlcvLegend');
    let priceChart, volumeChart, candleSeries, volSeries;
    let currentChartData = [];

    /* ── Feature Label Cleaning ─────────────────────────── */
    function cleanFeatureName(raw){
        const lc = raw.toLowerCase();
        if(lc.startsWith('macds')) return 'MACD Signal';
        if(lc.startsWith('macdh')) return 'MACD Histogram';
        if(lc.startsWith('macd')) return 'MACD';
        if(lc.startsWith('bbm')) return 'Bollinger Mid';
        if(lc.startsWith('bbu')) return 'Bollinger Upper';
        if(lc.startsWith('bbl')) return 'Bollinger Lower';
        if(lc.startsWith('bbw') || lc.includes('bb_width')) return 'Bollinger Width';
        if(lc.includes('rsi')) return 'RSI (14)';
        if(lc.includes('atr')) return 'ATR';
        if(lc.includes('sentiment')) return 'News Sentiment';
        if(lc.includes('market_corr') || lc.includes('correlation')) return 'Market Correlation';
        if(lc.includes('momentum_1')) return '1-Day Momentum';
        if(lc.includes('momentum_5')) return '5-Day Momentum';
        if(lc.includes('outperform')) return 'vs Nifty 50';
        if(lc.includes('volume')) return 'Volume';
        return raw.replace(/_/g,' ').replace(/\d+\.?\d*/g,'').replace(/\s+/g,' ').trim()
            .replace(/\b\w/g, c => c.toUpperCase()) || raw;
    }

    /* ── Clock & Market Status ─────────────────────────── */
    function updateClock(){
        const now = new Date();
        const ist = new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
        document.getElementById('liveClock').textContent =
            ist.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
        const d = ist.getDay(), h = ist.getHours(), m = ist.getMinutes();
        const mins = h*60+m;
        const open = d>=1 && d<=5 && mins>=555 && mins<=930;
        const badge = document.getElementById('marketBadge');
        badge.textContent = open ? 'MARKET OPEN' : 'CLOSED';
        badge.className = 'market-badge ' + (open ? 'market-open' : 'market-closed');
    }
    setInterval(updateClock, 1000); updateClock();

    /* ── Chart Init ────────────────────────────────────── */
    function initCharts(){
        const pc = document.getElementById('priceChart');
        const vc = document.getElementById('volumeChart');
        const common = {
            layout:{background:{type:'solid',color:'transparent'},textColor:'#8892a4',fontFamily:'Space Mono'},
            grid:{vertLines:{color:'#0d1825'},horzLines:{color:'#0d1825'}},
            crosshair:{mode:0,vertLine:{color:'rgba(0,212,255,0.3)',width:1,style:3,labelBackgroundColor:'#0f1729'},
                horzLine:{color:'rgba(0,212,255,0.3)',width:1,style:3,labelBackgroundColor:'#0f1729'}},
            timeScale:{borderColor:'rgba(0,212,255,0.15)',timeVisible:false},
            rightPriceScale:{borderColor:'rgba(0,212,255,0.15)'},
            handleScroll:true, handleScale:true,
        };
        priceChart = LightweightCharts.createChart(pc, {...common, width:pc.clientWidth, height:420});
        volumeChart = LightweightCharts.createChart(vc, {
            layout:{background:{type:'solid',color:'transparent'},textColor:'#8892a4',fontFamily:'Space Mono'},
            grid:{vertLines:{color:'#0d1825'},horzLines:{color:'#0d1825'}},
            timeScale:{visible:false},
            rightPriceScale:{visible:false}, leftPriceScale:{visible:false},
            handleScroll:false, handleScale:false,
            width:vc.clientWidth, height:120
        });

        candleSeries = priceChart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor:'#00ff88',downColor:'#ff3366',
            borderUpColor:'#00ff88',borderDownColor:'#ff3366',
            wickUpColor:'#00ff88',wickDownColor:'#ff3366',
        });
        volSeries = volumeChart.addSeries(LightweightCharts.HistogramSeries, {
            color:'rgba(0,212,255,0.3)',priceFormat:{type:'volume'},
            priceScaleId:'',
        });
        volumeChart.priceScale('').applyOptions({scaleMargins:{top:0,bottom:0}});

        /* Sync time scales */
        priceChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{
            if(r) volumeChart.timeScale().setVisibleLogicalRange(r);
        });
        volumeChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{
            if(r) priceChart.timeScale().setVisibleLogicalRange(r);
        });

        /* Resize */
        const ro = new ResizeObserver(()=>{
            priceChart.applyOptions({width:pc.clientWidth});
            volumeChart.applyOptions({width:vc.clientWidth});
        });
        ro.observe(pc);

        /* Crosshair Legend Setup */
        function setLegend(data) {
            if (!data) {
                legendEl.innerHTML = '';
                return;
            }
            const prevClose = data.prevClose !== undefined ? data.prevClose : data.open;
            const chg = data.close - prevClose;
            const chgPct = prevClose !== 0 ? (chg / prevClose) * 100 : 0;
            const valClass = chg >= 0 ? 'up' : 'down';
            const sign = chg >= 0 ? '+' : '';
            
            const formatVol = (v) => {
                if (v >= 1e7) return (v / 1e7).toFixed(2) + 'Cr';
                if (v >= 1e5) return (v / 1e5).toFixed(2) + 'L';
                if (v >= 1e3) return (v / 1e3).toFixed(2) + 'K';
                return v.toString();
            };

            legendEl.innerHTML = `
                <div class="legend-item"><span class="legend-label">O</span><span class="legend-val">${data.open.toFixed(2)}</span></div>
                <div class="legend-item"><span class="legend-label">H</span><span class="legend-val">${data.high.toFixed(2)}</span></div>
                <div class="legend-item"><span class="legend-label">L</span><span class="legend-val">${data.low.toFixed(2)}</span></div>
                <div class="legend-item"><span class="legend-label">C</span><span class="legend-val ${valClass}">${data.close.toFixed(2)}</span></div>
                <div class="legend-item"><span class="legend-label">Vol</span><span class="legend-val">${formatVol(data.volume)}</span></div>
                <div class="legend-item"><span class="legend-val ${valClass}">${sign}${chg.toFixed(2)} (${sign}${chgPct.toFixed(2)}%)</span></div>
            `;
        }

        priceChart.subscribeCrosshairMove(param => {
            if (param.time && param.seriesData.get(candleSeries)) {
                const priceData = param.seriesData.get(candleSeries);
                const volData = param.seriesData.get(volSeries) || { value: 0 };
                setLegend({
                    open: priceData.open,
                    high: priceData.high,
                    low: priceData.low,
                    close: priceData.close,
                    volume: volData.value
                });
            } else if (currentChartData.length > 0) {
                setLegend(currentChartData[currentChartData.length - 1]);
            } else {
                setLegend(null);
            }
        });
        
        // Export setLegend to be used in updateChart
        window.setLegend = setLegend;
    }
    initCharts();

    /* ── Skeleton HTML ─────────────────────────────────── */
    function showSkeleton(){
        rightPanel.innerHTML = `
        <div class="card card-accent"><div class="skeleton skeleton-block" style="width:55%"></div>
            <div class="skeleton skeleton-line" style="width:40%"></div>
            <div style="display:flex;gap:20px;margin-top:16px"><div class="skeleton skeleton-block" style="flex:1"></div><div class="skeleton skeleton-block" style="flex:1"></div></div></div>
        <div class="card"><div class="skeleton skeleton-line" style="width:35%"></div>
            <div class="skeleton skeleton-block" style="height:50px;margin:12px 0"></div>
            <div class="skeleton skeleton-line" style="width:70%"></div></div>
        <div class="card"><div class="skeleton skeleton-line" style="width:40%"></div>
            <div class="skeleton skeleton-line" style="width:90%"></div>
            <div class="skeleton skeleton-line" style="width:75%"></div>
            <div class="skeleton skeleton-line" style="width:60%"></div></div>`;
    }

    /* ── Render Right Panel ────────────────────────────── */
    function renderPanel(data, latest){
        const close = latest.close;
        const prevClose = latest.prevClose !== undefined ? latest.prevClose : latest.open;
        const change = ((latest.close - prevClose)/prevClose*100);
        const up = change >= 0;
        const arrow = up ? '▲' : '▼';
        const chClass = up ? 'up' : 'down';

        const sigColor = {BUY:'signal-BUY',SELL:'signal-SELL',HOLD:'signal-HOLD',UNCERTAIN:'signal-UNCERTAIN'};
        const sigClass = sigColor[data.recommendation] || 'signal-UNCERTAIN';

        let featuresHTML = '';
        if(data.top_features && data.top_features.length){
            const maxImp = Math.max(...data.top_features.map(f=>f.importance));
            featuresHTML = `<div class="card fade-in" id="driversCard">
                <div class="card-label">Signal Drivers</div>
                ${data.top_features.map((f,i)=>{
                    const pct = maxImp > 0 ? (f.importance/maxImp*100) : 0;
                    const label = cleanFeatureName(f.feature);
                    return `<div class="feature-row">
                        <span class="feature-name">${label}</span>
                        <div class="feature-bar-track"><div class="feature-bar-fill" data-w="${pct}" style="width:0%"></div></div>
                        <span class="feature-pct">${(f.importance*100).toFixed(1)}%</span>
                    </div>`;
                }).join('')}
            </div>`;
        }

        rightPanel.innerHTML = `
        <div class="card card-accent fade-in">
            <div class="card-label">Price Statistics</div>
            <div class="price-big">${formatNum(close)}</div>
            <div class="price-change ${chClass}">${arrow} ${Math.abs(change).toFixed(2)}%</div>
            <div class="stats-row">
                <div class="stat-item"><div class="label">Day High</div><div class="value">${formatNum(latest.high)}</div></div>
                <div class="stat-item"><div class="label">Day Low</div><div class="value">${formatNum(latest.low)}</div></div>
            </div>
        </div>
        <div class="card fade-in">
            <div class="card-label">ML Signal</div>
            <div class="signal-text ${sigClass}">${data.recommendation}</div>
            <div class="confidence-bar-wrap">
                <div class="confidence-track"><div class="confidence-fill" id="confBar" style="width:0%"></div></div>
                <span class="confidence-label">${data.confidence}%</span>
            </div>
            <div class="signal-time">As of ${data.predicted_at}</div>
        </div>
        ${featuresHTML}
        <div class="disclaimer">For research purposes only. Not financial advice.</div>`;

        /* Animate confidence bar */
        requestAnimationFrame(()=>{
            setTimeout(()=>{
                const cb = document.getElementById('confBar');
                if(cb) cb.style.width = data.confidence + '%';
                document.querySelectorAll('.feature-bar-fill[data-w]').forEach((el,i)=>{
                    setTimeout(()=>{ el.style.width = el.dataset.w + '%'; }, i*80);
                });
            }, 50);
        });
    }

    function formatNum(n){
        return typeof n === 'number' ? n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
    }

    /* ── Update Chart ──────────────────────────────────── */
    function updateChart(chartData){
        const formattedData = chartData
            .map(d => ({
                time: (d.time || d.date || '').split('T')[0],
                open: parseFloat(d.open),
                high: parseFloat(d.high),
                low: parseFloat(d.low),
                close: parseFloat(d.close),
                volume: parseFloat(d.volume) || 0
            }))
            .filter(d => d.time)
            .sort((a, b) => a.time.localeCompare(b.time))
            .map((d, i, arr) => {
                d.prevClose = i > 0 ? arr[i-1].close : d.open;
                return d;
            });

        candleSeries.setData(formattedData);

        const volumeData = formattedData
            .filter(d => d.volume > 0)
            .map(d => ({
                time: d.time,
                value: d.volume,
                color: d.close >= d.open
                    ? 'rgba(0, 255, 136, 0.5)'
                    : 'rgba(255, 51, 102, 0.5)'
            }));
        volSeries.setData(volumeData);

        currentChartData = formattedData;
        if (currentChartData.length > 0) {
            window.setLegend(currentChartData[currentChartData.length - 1]);
        }

        priceChart.timeScale().fitContent();
        volumeChart.timeScale().fitContent();
    }

    /* ── Error State ───────────────────────────────────── */
    function showError(msg){
        rightPanel.innerHTML = `<div class="card" style="flex:1;display:flex">
            <div class="error-box"><div class="icon">⚠</div>
            <div class="msg">Error</div><div class="detail">${msg}</div></div></div>`;
    }

    /* ── Fetch Logic ───────────────────────────────────── */
    async function fetchStocks(){
        try{
            const r = await fetch(API+'/api/stocks');
            const stocks = await r.json();
            const list = Array.isArray(stocks) ? stocks : (stocks.stocks || []);
            sel.innerHTML = '';
            list.forEach(s=>{
                const o = document.createElement('option');
                o.value = s; o.textContent = s; sel.appendChild(o);
            });
            if(list.length) loadStock(list[0]);
            else showError('No stocks available.');
        } catch(e){ showError('Could not load stock list.'); }
    }

    async function loadStock(ticker){
        document.getElementById('chartTicker').textContent = ticker;
        showSkeleton();
        try{
            const r = await fetch(API+'/api/stocks/'+encodeURIComponent(ticker));
            const data = await r.json();
            if(data.error) throw new Error(data.error);
            updateChart(data.chartData);
            const latest = data.chartData[data.chartData.length-1];
            renderPanel(data, latest);
            document.getElementById('lastRefresh').textContent =
                'Refreshed ' + new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});
        } catch(e){ showError(e.message); }
    }

    sel.addEventListener('change', e => loadStock(e.target.value));
    fetchStocks();
})();
</script>
</body>
</html>
