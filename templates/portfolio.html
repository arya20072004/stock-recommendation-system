<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Overview — Nifty Analyst</title>
    <meta name="description" content="ML-powered portfolio overview for all Nifty 50 stocks — sorted by conviction.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #080c14; --bg2: #0b1120; --bg3: #0f1729;
            --surface: rgba(13,23,42,0.65); --border: rgba(0,212,255,0.12);
            --cyan: #00d4ff; --green: #00ff88; --red: #ff3366;
            --amber: #f59e0b; --muted: #8892a4; --text: #c8d0dc;
            --white: #eaf0f6; --font-ui: 'Outfit', sans-serif; --font-mono: 'Space Mono', monospace;
        }
        html { font-size: 14px; }
        body {
            font-family: var(--font-ui); background: var(--bg); color: var(--text);
            min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(rgba(0,212,255,0.04) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.2); border-radius: 3px; }

        /* ── Navbar ──────────────────────────────── */
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; height: 56px;
            background: rgba(8,12,20,0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; }
        .nav-logo svg { width: 22px; height: 22px; }
        .nav-logo span {
            font-family: var(--font-mono); font-size: 0.92rem; font-weight: 700;
            letter-spacing: 3px; color: var(--white);
        }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-link {
            font-family: var(--font-mono); font-size: 0.78rem;
            color: var(--muted); text-decoration: none;
            padding: 4px 0; letter-spacing: 1px; transition: color 0.2s;
        }
        .nav-link:hover { color: var(--white); }
        .nav-link.active { color: var(--cyan); border-bottom: 2px solid var(--cyan); }
        .nav-right {
            display: flex; align-items: center; gap: 18px;
            font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted);
        }
        .market-badge {
            padding: 3px 10px; border-radius: 4px; font-size: 0.7rem;
            font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
        }
        .market-open { background: rgba(0,255,136,0.12); color: var(--green); border: 1px solid rgba(0,255,136,0.25); }
        .market-closed { background: rgba(255,51,102,0.1); color: var(--red); border: 1px solid rgba(255,51,102,0.2); }

        /* ── Page Container ──────────────────────── */
        .page { max-width: 1440px; margin: 0 auto; padding: 28px; }

        /* ── Page Header ─────────────────────────── */
        .page-header { margin-bottom: 24px; }
        .page-header h1 {
            font-family: var(--font-mono); font-size: 1.5rem; font-weight: 700;
            color: var(--white); letter-spacing: 2px; margin-bottom: 4px;
        }
        .page-header p { font-size: 0.85rem; color: var(--muted); }

        /* ── KPI Bar ─────────────────────────────── */
        .kpi-bar {
            display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
        }
        .kpi {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 14px 20px; backdrop-filter: blur(8px);
            min-width: 120px; flex: 1;
            transition: box-shadow 0.3s;
        }
        .kpi:hover { box-shadow: 0 0 16px rgba(0,212,255,0.08); }
        .kpi-value {
            font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700;
            line-height: 1;
        }
        .kpi-label { font-size: 0.7rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.5px; }

        /* ── Filter Bar ──────────────────────────── */
        .filter-bar { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .filter-btn {
            font-family: var(--font-mono); font-size: 0.78rem;
            background: var(--bg2); color: var(--muted);
            border: 1px solid var(--border); border-radius: 6px;
            padding: 7px 18px; cursor: pointer; letter-spacing: 1px;
            transition: all 0.2s;
        }
        .filter-btn:hover { color: var(--white); border-color: rgba(0,212,255,0.3); }
        .filter-btn.active { background: var(--cyan); color: var(--bg); border-color: var(--cyan); font-weight: 700; }

        /* ── Card Grid ───────────────────────────── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        /* ── Stock Card ──────────────────────────── */
        .stock-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; padding: 20px; backdrop-filter: blur(10px);
            cursor: pointer; text-decoration: none; color: inherit;
            display: flex; flex-direction: column; gap: 12px;
            transition: transform 0.2s, box-shadow 0.3s, border-color 0.3s;
        }
        .stock-card:hover { transform: translateY(-2px); }
        .stock-card.glow-buy { border-color: rgba(0,255,136,0.2); }
        .stock-card.glow-buy:hover { box-shadow: 0 0 24px rgba(0,255,136,0.12); }
        .stock-card.glow-sell { border-color: rgba(255,51,102,0.2); }
        .stock-card.glow-sell:hover { box-shadow: 0 0 24px rgba(255,51,102,0.12); }
        .stock-card.glow-hold { border-color: rgba(245,158,11,0.2); }
        .stock-card.glow-hold:hover { box-shadow: 0 0 24px rgba(245,158,11,0.1); }
        .stock-card.glow-uncertain { border-color: var(--border); }
        .stock-card.glow-uncertain:hover { box-shadow: 0 0 16px rgba(0,212,255,0.06); }

        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .card-ticker {
            font-family: var(--font-mono); font-size: 1rem; font-weight: 700;
            color: var(--white);
        }
        .rec-badge {
            font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700;
            padding: 3px 10px; border-radius: 4px; letter-spacing: 1px;
        }
        .rec-BUY { background: rgba(0,255,136,0.12); color: var(--green); }
        .rec-SELL { background: rgba(255,51,102,0.1); color: var(--red); }
        .rec-HOLD { background: rgba(245,158,11,0.1); color: var(--amber); }
        .rec-UNCERTAIN { background: rgba(136,146,164,0.1); color: var(--muted); }

        .card-mid { display: flex; align-items: baseline; gap: 10px; }
        .card-price {
            font-family: var(--font-mono); font-size: 1.35rem; font-weight: 700;
            color: var(--white);
        }
        .card-change {
            font-family: var(--font-mono); font-size: 0.8rem;
        }
        .card-change.up { color: var(--green); }
        .card-change.down { color: var(--red); }

        .card-bottom { display: flex; align-items: center; gap: 10px; }
        .conf-track {
            flex: 1; height: 4px; background: rgba(255,255,255,0.06);
            border-radius: 2px; overflow: hidden;
        }
        .conf-fill {
            height: 100%; background: var(--cyan); border-radius: 2px;
            transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
        }
        .conf-label {
            font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted);
            white-space: nowrap;
        }

        /* ── Loading ─────────────────────────────── */
        .loading-state {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 80px 20px; text-align: center;
        }
        .loading-state .spinner {
            width: 36px; height: 36px; border: 3px solid rgba(0,212,255,0.15);
            border-top-color: var(--cyan); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-state p {
            font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted);
            letter-spacing: 2px;
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        .skeleton-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; padding: 20px; height: 160px;
        }
        .skel-line { height: 14px; margin-bottom: 10px; border-radius: 4px; }
        .skel-block { height: 28px; margin-bottom: 10px; border-radius: 6px; }

        /* ── Footer ──────────────────────────────── */
        .footer {
            text-align: center; padding: 24px 0 12px;
            font-size: 0.7rem; color: rgba(136,146,164,0.4);
        }
        .footer span { display: block; margin-top: 4px; }

        /* ── Fade ─────────────────────────────────── */
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

        /* ── Responsive ──────────────────────────── */
        @media (max-width: 1200px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 960px) {
            .card-grid { grid-template-columns: repeat(2, 1fr); }
            .navbar { padding: 0 16px; flex-wrap: wrap; height: auto; gap: 8px; padding: 10px 16px; }
            .nav-right { font-size: 0.68rem; gap: 10px; }
            .nav-links { gap: 10px; }
            .page { padding: 16px; }
        }
        @media (max-width: 600px) {
            .card-grid { grid-template-columns: 1fr; }
            .kpi-bar { gap: 8px; }
            .kpi { min-width: 90px; padding: 10px 14px; }
        }
    </style>
</head>
<body>

<!-- ── Navbar ───────────────────────────────────── -->
<nav class="navbar">
    <div class="nav-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 8L12 14L20 8L12 2Z" fill="var(--cyan)" opacity="0.8"/>
            <path d="M4 12L12 18L20 12" stroke="var(--cyan)" stroke-width="1.5" fill="none" opacity="0.5"/>
            <path d="M4 16L12 22L20 16" stroke="var(--cyan)" stroke-width="1.5" fill="none" opacity="0.25"/>
        </svg>
        <span>NIFTY ANALYST</span>
    </div>

    <div class="nav-links">
        <a href="/" class="nav-link">&gt; DASHBOARD</a>
        <a href="/portfolio" class="nav-link active">&gt; PORTFOLIO</a>
    </div>

    <div class="nav-right">
        <span id="liveClock">--:--:--</span>
        <span id="marketBadge" class="market-badge market-closed">CLOSED</span>
    </div>
</nav>

<!-- ── Page Content ─────────────────────────────── -->
<div class="page">
    <div class="page-header">
        <h1>PORTFOLIO OVERVIEW</h1>
        <p>All Nifty 50 ML Signals &mdash; sorted by conviction</p>
    </div>

    <div class="kpi-bar" id="kpiBar">
        <div class="kpi"><div class="kpi-value" id="kpiTotal" style="color:var(--white)">—</div><div class="kpi-label">Total Analyzed</div></div>
        <div class="kpi"><div class="kpi-value" id="kpiBuy" style="color:var(--green)">—</div><div class="kpi-label">BUY Signals</div></div>
        <div class="kpi"><div class="kpi-value" id="kpiHold" style="color:var(--amber)">—</div><div class="kpi-label">HOLD Signals</div></div>
        <div class="kpi"><div class="kpi-value" id="kpiSell" style="color:var(--red)">—</div><div class="kpi-label">SELL Signals</div></div>
        <div class="kpi"><div class="kpi-value" id="kpiUncertain" style="color:var(--muted)">—</div><div class="kpi-label">UNCERTAIN</div></div>
    </div>

    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="ALL">ALL</button>
        <button class="filter-btn" data-filter="BUY">BUY</button>
        <button class="filter-btn" data-filter="HOLD">HOLD</button>
        <button class="filter-btn" data-filter="SELL">SELL</button>
    </div>

    <div class="card-grid" id="cardGrid">
        <!-- Populated by JS -->
    </div>

    <div class="footer">
        For research purposes only. Not financial advice.
        <span id="lastUpdated"></span>
    </div>
</div>

<script>
(function(){
    /* ── Clock ────────────────────────────────── */
    function updateClock(){
        const now = new Date();
        const ist = new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
        document.getElementById('liveClock').textContent =
            ist.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
        const d = ist.getDay(), h = ist.getHours(), m = ist.getMinutes();
        const mins = h*60+m;
        const open = d>=1 && d<=5 && mins>=555 && mins<=930;
        const badge = document.getElementById('marketBadge');
        badge.textContent = open ? 'MARKET OPEN' : 'CLOSED';
        badge.className = 'market-badge ' + (open ? 'market-open' : 'market-closed');
    }
    setInterval(updateClock, 1000); updateClock();

    /* ── State ────────────────────────────────── */
    let allStocks = [];
    let activeFilter = 'ALL';
    const grid = document.getElementById('cardGrid');

    /* ── Skeleton Loading ─────────────────────── */
    function showLoading(){
        let html = '';
        for(let i = 0; i < 12; i++){
            html += `<div class="skeleton-card">
                <div class="skeleton skel-line" style="width:50%"></div>
                <div class="skeleton skel-block" style="width:70%"></div>
                <div class="skeleton skel-line" style="width:90%"></div>
            </div>`;
        }
        grid.innerHTML = html;
    }

    /* ── Render KPIs ──────────────────────────── */
    function renderKPIs(data){
        document.getElementById('kpiTotal').textContent = data.length;
        document.getElementById('kpiBuy').textContent = data.filter(s=>s.recommendation==='BUY').length;
        document.getElementById('kpiHold').textContent = data.filter(s=>s.recommendation==='HOLD').length;
        document.getElementById('kpiSell').textContent = data.filter(s=>s.recommendation==='SELL').length;
        document.getElementById('kpiUncertain').textContent = data.filter(s=>s.recommendation==='UNCERTAIN').length;
    }

    /* ── Format Number ────────────────────────── */
    function fmt(n){
        return typeof n === 'number' ? n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
    }

    /* ── Render Cards ─────────────────────────── */
    function renderCards(){
        const filtered = activeFilter === 'ALL'
            ? allStocks
            : allStocks.filter(s => s.recommendation === activeFilter);

        if(filtered.length === 0){
            grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 0;">
                <p style="font-family:var(--font-mono);color:var(--muted);letter-spacing:1px;">No ${activeFilter} signals found.</p>
            </div>`;
            return;
        }

        grid.innerHTML = filtered.map(s => {
            const rec = s.recommendation;
            const glowClass = rec === 'BUY' ? 'glow-buy' : rec === 'SELL' ? 'glow-sell'
                : rec === 'HOLD' ? 'glow-hold' : 'glow-uncertain';
            const recClass = 'rec-' + rec;
            const up = s.day_change_pct >= 0;
            const arrow = up ? '▲' : '▼';
            const chClass = up ? 'up' : 'down';

            return `<a href="/?stock=${encodeURIComponent(s.ticker)}" class="stock-card ${glowClass} fade-in">
                <div class="card-top">
                    <span class="card-ticker">${s.ticker.replace('.NS','')}</span>
                    <span class="rec-badge ${recClass}">${rec}</span>
                </div>
                <div class="card-mid">
                    <span class="card-price">${fmt(s.last_close)}</span>
                    <span class="card-change ${chClass}">${arrow} ${Math.abs(s.day_change_pct).toFixed(2)}%</span>
                </div>
                <div class="card-bottom">
                    <div class="conf-track"><div class="conf-fill" style="width:${s.confidence}%"></div></div>
                    <span class="conf-label">${s.confidence}%</span>
                </div>
            </a>`;
        }).join('');
    }

    /* ── Filter Buttons ───────────────────────── */
    document.getElementById('filterBar').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if(!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderCards();
    });

    /* ── Fetch Portfolio ──────────────────────── */
    async function fetchPortfolio(){
        showLoading();
        try {
            const r = await fetch('/api/stocks/summary');
            const data = await r.json();
            if(data.error) throw new Error(data.error);
            allStocks = data.data || [];
            renderKPIs(allStocks);
            renderCards();
            document.getElementById('lastUpdated').textContent =
                'Last updated: ' + new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});
        } catch(e){
            grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:80px 0;">
                <p style="font-size:1.2rem;color:var(--red);font-weight:600;margin-bottom:8px;">Failed to load portfolio</p>
                <p style="color:var(--muted);font-size:0.85rem;">${e.message}</p>
            </div>`;
        }
    }

    fetchPortfolio();
})();
</script>
</body>
</html>
